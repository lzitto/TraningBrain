<!DOCTYPE html>
<html>
<head>
    <title>Exercício 04 - Roteiro V</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script>
        // Rest (...) aceita múltiplos arrays como argumentos
        // Spread (...) "desempacota" cada array dentro do array final
        const combinarEOrdenar = (...arrays) => {
            const combinado = [...arrays.flat()];
            const ordenado = combinado.sort((a, b) => a - b);
            return ordenado;
        };

        // Callback que recebe o resultado e exibe
        const exibir = (resultado) => {
            console.log(resultado);
        };

        const numeros1 = [30, 10];
        const numeros2 = [50, 20];
        const numeros3 = [40];

        exibir(combinarEOrdenar(numeros1, numeros2, numeros3));
        // [10, 20, 30, 40, 50]
    </script>
</head>
<body>
    <h2>Exercício 04 - Spread: combinar e ordenar arrays</h2>
    <p>Abra o console do navegador (F12) para ver a saída.</p>
</body>
</html>
